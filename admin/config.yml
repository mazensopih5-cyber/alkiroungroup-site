backend:
  name: github
  repo: mazensopih5-cyber/alkiroungroup-site
  branch: main
  base_url: https://sveltia-cms-auth.mazensopih5.workers.dev
media_folder: assets/uploads
public_folder: /assets/uploads
collections:
  - name: site
    label: 'Company info'
    files:
      - {label: 'Company info', name: site, file: content/site.json, fields: [{label: 'Company name (عربي)', name: name_ar, widget: string, required: true}, {label: 'Company name (English)', name: name_en, widget: string, required: true}, {label: 'Subtitle under name (عربي)', name: sub_ar, widget: string, required: false}, {label: 'Subtitle under name (English)', name: sub_en, widget: string, required: false}, {label: 'Tagline (عربي)', name: tagline_ar, widget: string, required: true}, {label: 'Tagline (English)', name: tagline_en, widget: string, required: true}, {label: 'About (عربي)', name: about_ar, widget: text, required: true}, {label: 'About (English)', name: about_en, widget: text, required: true}, {label: 'Phone', name: phone, widget: string}, {label: 'WhatsApp (e.g. 201000000000)', name: whatsapp, widget: string}, {label: 'Email', name: email, widget: string}, {label: 'Address (عربي)', name: address_ar, widget: string, required: true}, {label: 'Address (English)', name: address_en, widget: string, required: true}, {label: 'Why us (لماذا نحن)', name: why, widget: list, summary: '{{fields.title_ar}}', fields: [{label: 'Title (عربي)', name: title_ar, widget: string}, {label: 'Title (English)', name: title_en, widget: string}, {label: 'Text (عربي)', name: text_ar, widget: text}, {label: 'Text (English)', name: text_en, widget: text}]}, {label: 'Facebook link', name: facebook, widget: string, required: false}, {label: 'LinkedIn link', name: linkedin, widget: string, required: false}]}
  - name: products
    label: 'Products (منتجاتنا)'
    files:
      - {label: 'Products (منتجاتنا)', name: products, file: content/products.json, fields: [{label: 'Items', name: items, widget: list, summary: '{{fields.name_ar}}', fields: [{label: 'Name (عربي)', name: name_ar, widget: string, required: true}, {label: 'Name (English)', name: name_en, widget: string, required: true}, {label: 'Category (عربي)', name: category_ar, widget: string, required: true}, {label: 'Category (English)', name: category_en, widget: string, required: true}, {label: 'Description (عربي)', name: desc_ar, widget: text, required: false}, {label: 'Description (English)', name: desc_en, widget: text, required: false}, {label: 'Main photo (الصورة الرئيسية)', name: image, widget: image, required: false}, {label: 'More photos (صور إضافية)', name: gallery, widget: list, required: false, summary: '{{fields.caption_ar}}', fields: [{label: 'Photo', name: image, widget: image}, {label: 'Caption (عربي)', name: caption_ar, widget: string, required: false}, {label: 'Caption (English)', name: caption_en, widget: string, required: false}]}]}]}
  - name: works
    label: 'Our work (أعمالنا)'
    files:
      - {label: 'Our work (أعمالنا)', name: works, file: content/works.json, fields: [{label: 'Items', name: items, widget: list, summary: '{{fields.name_ar}}', fields: [{label: 'Title (عربي)', name: name_ar, widget: string, required: true}, {label: 'Title (English)', name: name_en, widget: string, required: true}, {label: 'Description (عربي)', name: desc_ar, widget: text, required: false}, {label: 'Description (English)', name: desc_en, widget: text, required: false}, {label: 'Image', name: image, widget: image, required: false}]}]}
  - name: local
    label: 'Local suppliers (موردينا من الداخل)'
    files:
      - {label: 'Local suppliers (موردينا من الداخل)', name: local, file: content/local.json, fields: [{label: 'Items', name: items, widget: list, summary: '{{fields.name_ar}}', fields: [{label: 'Name (عربي)', name: name_ar, widget: string, required: true}, {label: 'Name (English)', name: name_en, widget: string, required: true}, {label: 'Description (عربي)', name: desc_ar, widget: text, required: false}, {label: 'Description (English)', name: desc_en, widget: text, required: false}, {label: 'Image', name: image, widget: image, required: false}]}]}
  - name: foreign
    label: 'Foreign suppliers (موردينا من الخارج)'
    files:
      - {label: 'Foreign suppliers (موردينا من الخارج)', name: foreign, file: content/foreign.json, fields: [{label: 'Items', name: items, widget: list, summary: '{{fields.name_ar}}', fields: [{label: 'Name (عربي)', name: name_ar, widget: string, required: true}, {label: 'Name (English)', name: name_en, widget: string, required: true}, {label: 'Country (عربي)', name: country_ar, widget: string, required: true}, {label: 'Country (English)', name: country_en, widget: string, required: true}, {label: 'Description (عربي)', name: desc_ar, widget: text, required: false}, {label: 'Description (English)', name: desc_en, widget: text, required: false}, {label: 'Image', name: image, widget: image, required: false}]}]}
