<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>القيروان جروب | Al Kiroun Group</title>
<meta name="description" content="القيروان جروب لمنتجات صحة الحيوان: استيراد إضافات الأعلاف والمطهرات ومنتجات صحة الحيوان.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
:root{--ink:#17301a;--green:#2f8f1f;--leaf:#6cb33f;--deep:#1d5c17;--sky:#e8f5fd;--sky2:#a9d9f3;--red:#d62828;--line:#d5e6d0;--bg:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:'Readex Pro',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.8}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--leaf)}
.bar{max-width:1100px;margin:auto;padding:.5rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;color:var(--deep);flex:1;min-width:200px}
.bt{display:flex;flex-direction:column;line-height:1.3}.bt b{font-size:1.3rem;font-weight:700}.bt small{font-size:.8rem;font-weight:300;color:var(--ink)}
.brand img{width:52px;height:52px}
nav{display:flex;gap:.25rem;flex-wrap:wrap}
nav a{padding:.45rem .9rem;border-radius:99px;font-weight:600;font-size:.95rem}
nav a:hover{background:var(--sky)}
nav a.on{background:var(--green);color:#fff}
.lang{border:2px solid var(--green);background:#fff;color:var(--deep);font:inherit;font-weight:600;padding:.3rem .9rem;border-radius:99px;cursor:pointer}
main{max-width:1100px;margin:auto;padding:1.5rem 1rem 3rem}
.hero{width:100vw;margin-inline:calc(50% - 50vw);margin-top:-1.5rem;min-height:68vh;display:grid;place-items:center;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff 0%,var(--sky) 55%,var(--sky2) 140%)}
.hero:before,.hero:after{content:"";position:absolute;width:42vw;max-width:520px;aspect-ratio:1;border-radius:0 100% 0 100%;background:linear-gradient(135deg,var(--leaf),var(--green));opacity:.13;filter:blur(3px)}
.hero:before{inset-block-end:-12%;inset-inline-start:-8%;transform:rotate(15deg)}
.hero:after{inset-block-start:-14%;inset-inline-end:-8%;transform:rotate(195deg)}
.hero img{position:relative;z-index:1;width:min(60vw,290px);height:auto;filter:drop-shadow(0 12px 24px rgba(29,92,23,.18))}
.tabs{display:flex;gap:.5rem;margin-bottom:1.2rem}.tabs button{font:inherit;font-weight:600;padding:.5rem 1.3rem;border-radius:99px;border:2px solid var(--green);background:#fff;color:var(--deep);cursor:pointer}.tabs button.on{background:var(--green);color:#fff}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin:2rem 0}.why div{border-inline-start:6px solid var(--leaf);background:var(--sky);padding:1rem 1.2rem;border-radius:.4rem 1.2rem 1.2rem .4rem}.why h3{color:var(--deep);font-size:1.1rem}
.btn{display:inline-block;background:var(--green);color:#fff;padding:.7rem 1.5rem;border-radius:99px;font-weight:600}
.btn.alt{background:#fff;color:var(--deep);border:2px solid var(--green);margin-inline-start:.5rem}
h2{font-size:1.7rem;color:var(--deep);margin:0 0 1.2rem;padding-bottom:.4rem;border-bottom:3px solid var(--leaf);display:inline-block}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin:2rem 0}
.tile{background:var(--sky);border-radius:1.2rem 1.2rem 1.2rem .3rem;padding:1.2rem;font-weight:700;color:var(--deep);border-inline-start:6px solid var(--leaf)}
.tile:hover{background:var(--sky2)}
.about{background:linear-gradient(var(--sky),#fff);border-radius:1.5rem;padding:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.2rem}
.card{border:1px solid var(--line);border-radius:1rem;overflow:hidden;background:#fff}
.card .im{aspect-ratio:4/3;background:var(--sky);display:grid;place-items:center}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .im.ph img{width:40%;height:auto;opacity:.5}
.card .tx{padding:1rem}.card h3{font-size:1.1rem;color:var(--deep)}
.tag{display:inline-block;font-size:.8rem;background:var(--sky);color:var(--deep);border-radius:99px;padding:0 .7rem;margin-bottom:.3rem}
.contact{display:grid;gap:.6rem;margin-top:0;background:var(--sky);padding:1.5rem;border-radius:1.5rem}
.contact a{color:var(--deep);font-weight:600;text-decoration:underline}
.wa{background:var(--red);color:#fff!important;text-decoration:none!important;padding:.5rem 1.2rem;border-radius:99px;justify-self:start}
footer{background:var(--deep);color:#fff;text-align:center;padding:1.2rem;font-size:.9rem}
body{overflow-x:hidden}
@media(prefers-reduced-motion:no-preference){main{animation:in .4s}@keyframes in{from{opacity:0}}}
</style></head><body>
<header><div class="bar"><a class="brand" href="#/"><img src="assets/logo.png" alt=""><span class="bt"><b id="bn"></b><small id="bs"></small></span></a><nav id="nav" aria-label="main"></nav><button class="lang" id="lg"></button></div></header>
<main id="app"></main><footer id="ft"></footer>
<script>
const L={ar:{home:'الرئيسية',products:'منتجاتنا',works:'أعمالنا',partners:'الشراكات',contact:'تواصل معنا',local:'موردينا من الداخل',foreign:'موردينا من الخارج',about:'من نحن',why:'لماذا نحن',empty:'لا توجد عناصر بعد.',phone:'التليفون',email:'الإيميل',addr:'العنوان',wa:'واتساب',lang:'English',rights:'جميع الحقوق محفوظة'},
en:{home:'Home',products:'Our Products',works:'Our Work',partners:'Partnerships',contact:'Contact Us',local:'Local Suppliers',foreign:'International Suppliers',about:'About Us',why:'Why Us',empty:'Nothing here yet.',phone:'Phone',email:'Email',addr:'Address',wa:'WhatsApp',lang:'العربية',rights:'All rights reserved'}};
const P=['products','works','local','foreign'],N=['products','works','partners','contact'];let lang=localStorage.lang||'ar',tab='local',D={};
const t=(o,k)=>o[k+'_'+lang]||o[k+'_ar']||'';const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){const n=['site',...P];const r=await Promise.all(n.map(x=>fetch('content/'+x+'.json').then(r=>r.json()).catch(()=>({items:[]}))));n.forEach((x,i)=>D[x]=r[i])}
function card(i,x){const im=x.image?`<div class="im"><img src="${esc(x.image)}" alt="${esc(t(x,'name'))}" loading="lazy"></div>`:`<div class="im ph"><img src="assets/logo.png" alt=""></div>`;
const tag=t(x,'category')||t(x,'country');return `<article class="card">${im}<div class="tx">${tag?`<span class="tag">${esc(tag)}</span>`:''}<h3>${esc(t(x,'name'))}</h3><p>${esc(t(x,'desc'))}</p></div></article>`}
function contact(s){const w=s.whatsapp?`<a class="wa" href="https://wa.me/${esc(s.whatsapp)}">${L[lang].wa}</a>`:'';
return `<section class="contact" id="contact"><h2 style="justify-self:start;margin-bottom:.5rem">${L[lang].contact}</h2><div>${L[lang].phone}: <a href="tel:${esc(s.phone)}" dir="ltr">${esc(s.phone)}</a></div><div>${L[lang].email}: <a href="mailto:${esc(s.email)}">${esc(s.email)}</a></div><div>${L[lang].addr}: ${esc(t(s,'address'))}</div>${s.facebook?`<a href="${esc(s.facebook)}">Facebook</a>`:''}${s.linkedin?`<a href="${esc(s.linkedin)}">LinkedIn</a>`:''}${w}</section>`}
function render(){const s=D.site,l=L[lang],h=(location.hash.slice(2)||'home');document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';
document.title=t(s,'name')+' | '+t(s,'sub');bn.textContent=t(s,'name');bs.textContent=t(s,'sub');lg.textContent=l.lang;ft.textContent='© '+new Date().getFullYear()+' '+t(s,'name')+' — '+l.rights;
nav.innerHTML=['home',...N].map(k=>`<a href="#/${k=='home'?'':k}" class="${k==h?'on':''}">${l[k]}</a>`).join('');
let o='';if(h=='products'||h=='works'){const it=D[h].items||[];o=`<h2>${l[h]}</h2><div class="grid">${it.length?it.map((x,i)=>card(i,x)).join(''):`<p>${l.empty}</p>`}</div>`}
else if(h=='partners'){const it=D[tab].items||[];o=`<h2>${l.partners}</h2><div class="tabs">${['local','foreign'].map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${l[k]}</button>`).join('')}</div><div class="grid">${it.length?it.map((x,i)=>card(i,x)).join(''):`<p>${l.empty}</p>`}</div>`}
else if(h=='contact'){o=contact(s)}
else{o=`<section class="hero"><img src="assets/logo.png" alt="${esc(t(s,'name'))}"></section><section class="about" style="margin-top:2rem"><h2>${l.about}</h2><p>${esc(t(s,'about'))}</p></section><h2 style="margin-top:2rem">${l.why}</h2><div class="why">${(s.why||[]).map(w=>`<div><h3>${esc(t(w,'title'))}</h3><p>${esc(t(w,'text'))}</p></div>`).join('')}</div>`}
app.innerHTML=o;scrollTo(0,0)}
lg.onclick=()=>{lang=lang=='ar'?'en':'ar';localStorage.lang=lang;render()};addEventListener('hashchange',render);
load().then(render);
if(window.netlifyIdentity)netlifyIdentity.on('init',u=>{if(!u)netlifyIdentity.on('login',()=>location.href='/admin/')});
</script></body></html>
